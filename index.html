<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COREL 3D GLB Studio V8</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<aside class="panel left"><header><b>COREL 3D GLB</b><small>V8 • editor 2D → 3D → GLB</small></header>
<label class="drop">Importar arquivo<input id="file" type="file" accept=".svg,.pdf,.dxf,.json,image/*"></label><div id="status">SVG é o fluxo de maior fidelidade.</div>
<section><h3>IMPORTAR</h3><div class="grid2"><button data-open="svg">SVG</button><button data-open="raster">PNG/JPG</button><button data-open="pdf">PDF</button><button data-open="dxf">DXF</button></div><div class="grid2"><button id="saveProject">Salvar projeto</button><button id="loadProject">Abrir projeto</button></div></section>
<section><h3>TEXTO 3D</h3><input id="textInput" value="Ghost 3D"><div class="grid3"><input id="textSize" type="number" value="28"><input id="textDepth" type="number" value="8"><input id="textColor" type="color" value="#ffd700"></div><button id="addText">Criar texto</button></section>
<section><h3>FORMAS GEOMÉTRICAS</h3><select id="shapeMode"><option value="2d">2D extrudada</option><option value="3d">3D pronta</option></select><select id="shape2d"><option value="rect">Retângulo</option><option value="round">Retângulo arredondado</option><option value="square">Quadrado</option><option value="circle">Círculo</option><option value="ellipse">Elipse</option><option value="triangle">Triângulo</option><option value="diamond">Losango</option><option value="pentagon">Pentágono</option><option value="hexagon">Hexágono</option><option value="octagon">Octógono</option><option value="star">Estrela</option><option value="arrow">Seta</option></select><select id="shape3d"><option value="box">Caixa</option><option value="sphere">Esfera</option><option value="cylinder">Cilindro</option><option value="cone">Cone</option><option value="pyramid">Pirâmide</option><option value="torus">Toro</option><option value="capsule">Cápsula</option></select><div class="grid3"><input id="sw" type="number" value="40" title="largura"><input id="sh" type="number" value="25" title="altura"><input id="sd" type="number" value="8" title="profundidade"></div><div class="grid3"><input id="sr" type="number" value="16" title="raio"><input id="ssides" type="number" value="6" min="3"><input id="scolor" type="color" value="#775cff"></div><button id="addShape">Adicionar forma</button></section>
<section><h3>CAMADAS <span id="count">0</span></h3><div id="layers"></div></section>
<section><h3>MODELAGEM</h3><div class="grid3"><button id="union">Unir</button><button id="subtract">Subtrair</button><button id="intersect">Interseção</button></div><div class="grid2"><button id="relief">Relevo +2</button><button id="basrelief">Baixo -2</button></div><div class="grid3"><button id="mx">Espelhar X</button><button id="my">Espelhar Y</button><button id="mz">Espelhar Z</button></div><div class="grid2"><button id="center">Centralizar</button><button id="ground">No chão</button></div></section>
<section><h3>EXPORTAÇÃO</h3><div class="grid2"><button id="exportOne">GLB peça</button><button id="exportAll" class="primary">GLB completo</button><button id="exportMerged">GLB mesclado</button><button id="snapshot">Preview PNG</button></div></section></aside>
<main id="stage"><div class="hud"><span id="fileName">Novo projeto</span><span id="stats">0 triângulos</span></div><div class="hint">Arraste: girar • Scroll: zoom • Clique: selecionar • Gizmo: W/E/R</div></main>
<aside class="panel right"><section><h3>PEÇA SELECIONADA</h3><div id="selected">Nenhuma</div><input id="name" placeholder="Nome"><label>Profundidade <input id="depth" type="range" min=".5" max="120" step=".5" value="10"></label><label>Bevel <input id="bevel" type="range" min="0" max="15" step=".25" value="1"></label><div class="grid3"><input id="px" type="number" step=".1"><input id="py" type="number" step=".1"><input id="pz" type="number" step=".1"></div><div class="grid3"><input id="rx" type="number" step="1"><input id="ry" type="number" step="1"><input id="rz" type="number" step="1"></div><div class="grid3"><input id="sx" type="number" step=".05"><input id="sy" type="number" step=".05"><input id="sz" type="number" step=".05"></div><div class="grid2"><input id="color" type="color"><select id="finish"><option value="matte">Fosco</option><option value="gloss">Brilhante</option><option value="metal">Metal</option><option value="plastic">Plástico</option><option value="gold">Ouro</option><option value="chrome">Cromado</option></select></div><div class="grid3"><button id="move">Mover</button><button id="rotate">Rotacionar</button><button id="scale">Escalar</button></div><div class="grid2"><button id="duplicate">Duplicar</button><button id="delete">Excluir</button></div></section>
<section><h3>BASE</h3><div class="grid2"><input id="basePad" type="number" value="12"><input id="baseDepth" type="number" value="4"></div><div class="grid2"><button id="base">Criar base</button><button id="removeBase">Remover base</button></div></section>
<section><h3>AMBIENTE</h3><select id="bg"><option value="dark">Escuro</option><option value="gray">Cinza</option><option value="white">Branco</option><option value="blue">Azul</option></select><select id="light"><option value="studio">Studio</option><option value="soft">Suave</option><option value="dramatic">Dramático</option><option value="flat">Plano</option></select><label><input id="autorotate" type="checkbox"> Auto-rotação</label></section>
<section><h3>ROBLOX</h3><button id="roblox">Otimizar para Roblox</button></section></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script><script type="module" src="app.js"></script></body></html>
